# Alpaca 指令微调的运行参数
#
# 默认用 124M：本机是 RTX 5060 Laptop / 8GB 显存，355M 在 fp32 下微调会 OOM。
# 想跑 355M 用 configs/sft-medium-bf16.yaml（必须开 bf16）。
model:
  # 架构超参来自这份 yaml（GPTConfig.from_yaml）
  config: configs/gpt2-small.yaml
  # 尺寸标注，仅作记录；真正的 n_layers/emb_dim 以 model.config 为准
  size: 124M
  # 可选值 fp32 | bf16。fp32 对 124M 全参数微调在 8GB 上勉强够用
  precision: fp32

# 数据来源
data:
  # 缺省从这个 URL 拉 https://raw.githubusercontent.com/rasbt/LLMs-from-scratch/main/ch07/01_main-chapter-code/instruction-data.json
  local_json: null
  # 85% 训练 / 10% 测试 / 5% 验证（沿用 v1 module_fine_tuning.py:344-349 的划分）
  train_ratio: 0.85
  test_ratio: 0.10

# 训练超参（微调通常比预训练小 1~2 个数量级）
train:
  batch_size: 8
  num_epochs: 2
  learning_rate: 0.00005
  weight_decay: 0.1
  allowed_max_length: 1024
  num_workers: 0
  # 随机种子（CLI --seed 可覆盖；留在这里是为了"超参只能来自 yaml"）
  seed: 123

# 生成回复时的采样设置（temperature=0 -> 贪婪，评测时更可复现）
generation:
  max_new_tokens: 256
  temperature: 0.0
  top_k: null
  eos_id: 50256

# 产物路径（均已 gitignore）
output:
  responses_json: outputs/instruction-data-with-response.json
  model_pth: outputs/model-sft.pth
